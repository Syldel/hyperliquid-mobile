<app-refreshable-layout
  title="Strategies"
  [fetchFn]="fetchFn()"
  emptyMessage="No strategy yet. Tap + to build one."
  (dataLoaded)="onDataLoaded($event)"
>
  <ng-template #endButtons>
    <ion-button (click)="pasteImport()" aria-label="Import strategies from JSON">
      <ion-icon slot="icon-only" name="clipboard-outline" />
    </ion-button>
    <ion-button (click)="copyAll()" aria-label="Copy the whole library as JSON">
      <ion-icon slot="icon-only" name="copy-outline" />
    </ion-button>
  </ng-template>

  <ion-list>
    @for (document of documents(); track document.id) {
    <ion-item button (click)="openBuilder(document)">
      <ion-label>
        <h2>{{ document.name }}</h2>
        <ion-note>{{ branchSummary(document) }}</ion-note>
      </ion-label>
      <ion-icon
        name="ellipsis-horizontal"
        slot="end"
        color="medium"
        (click)="openActions(document, $event)"
      />
    </ion-item>
    }
  </ion-list>
</app-refreshable-layout>

<ion-fab slot="fixed" vertical="bottom" horizontal="end">
  <ion-fab-button (click)="create()">
    <ion-icon name="add-outline" />
  </ion-fab-button>
</ion-fab>
